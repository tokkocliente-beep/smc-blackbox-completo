<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Criar conta — SMC BLACKBOX</title>
<style>
  :root{ --bg:#0a0e17; --panel:#0f131c; --panel2:#141a26; --border:#232a38;
         --cyan:#22d3ee; --yellow:#facc15; --muted:#5a627a; --muted2:#9aa4ba; }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:#e8ecf1;font-family:'JetBrains Mono',monospace;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px}
  .cube{width:44px;height:44px;display:block;margin:0 auto 10px;color:var(--cyan);filter:drop-shadow(0 0 10px rgba(0,210,255,0.5))}
  h1{font-size:17px;color:var(--cyan);margin:0 0 2px;text-align:center;letter-spacing:.04em}
  .sub{font-size:10.5px;color:var(--yellow);text-align:center;letter-spacing:.08em;margin-bottom:22px}
  label{display:block;font-size:10px;color:var(--muted2);margin:14px 0 5px;letter-spacing:.05em}
  input{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;color:#fff;font-family:inherit;font-size:13px}
  input:focus{outline:none;border-color:var(--cyan)}
  button{width:100%;margin-top:22px;padding:12px;background:var(--cyan);color:#00131a;border:none;
    border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.04em}
  button:hover{filter:brightness(1.08)}
  .flash{background:rgba(239,83,80,0.12);border:1px solid #ef5350;color:#ff8a85;
    border-radius:8px;padding:10px 12px;font-size:11.5px;margin-bottom:14px}
  .rodape{text-align:center;margin-top:20px;font-size:11px;color:var(--muted2)}
  .rodape a{color:var(--cyan);text-decoration:none}
  .rodape a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <svg class="cube" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 2V12M12 12L21 7M12 12L3 7M12 12V22" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
  <h1>SMC BLACKBOX</h1>
  <p class="sub">CRIAR CONTA</p>

  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      {% for m in mensagens %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <label for="email">EMAIL</label>
    <input type="email" id="email" name="email" required autocomplete="email">

    <label for="senha">SENHA</label>
    <input type="password" id="senha" name="senha" required minlength="6" autocomplete="new-password">

    <label for="confirmar">CONFIRMAR SENHA</label>
    <input type="password" id="confirmar" name="confirmar" required minlength="6" autocomplete="new-password">

    <button type="submit">Criar conta</button>
  </form>

  <p class="rodape">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
</body>
</html>
